[project]
name = "ai-playwright-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.8.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
]
[tool.pytest.ini_options]
markers = [
    "smoke: Smoke test suite",
    "regression: Regression test suite",
    "ai_generated: AI generated test matrix",
]
